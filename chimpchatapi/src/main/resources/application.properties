spring.application.name=chimpchatapi
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth.unified.app-id=${META_APP_ID:${META_FACEBOOK_APP_ID:}}
app.oauth.unified.app-secret=${META_APP_SECRET:${META_FACEBOOK_APP_SECRET:}}
app.oauth.unified.config-id=${META_CONFIG_ID:${META_INSTAGRAM_CONFIG_ID:${META_FACEBOOK_CONFIG_ID:}}}
app.oauth.unified.redirect-uri=${META_REDIRECT_URI:${META_FACEBOOK_REDIRECT_URI:${META_INSTAGRAM_REDIRECT_URI:https://gauntlet-sliver-headfirst.ngrok-free.dev/api/auth/instagram/callback}}}
