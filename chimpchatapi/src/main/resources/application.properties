spring.application.name=chimpchatapi
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=local

server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.auth.email-link.base-url=${app.frontend-url}/auth/verify
app.auth.email-link.ttl=PT15M
app.auth.email-link.from=${MAIL_FROM:ChimpChat <no-reply@chimpchat.local>}
app.auth.email.enabled=${EMAIL_AUTH_ENABLED:false}
app.auth.google.enabled=${GOOGLE_AUTH_ENABLED:true}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/login/oauth2/code/google}
app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
app.oauth.instagram.app-id=${META_APP_ID:${META_FACEBOOK_APP_ID:}}
app.oauth.instagram.app-secret=${META_APP_SECRET:${META_FACEBOOK_APP_SECRET:}}
app.oauth.instagram.config-id=${META_CONFIG_ID:${META_INSTAGRAM_CONFIG_ID:${META_FACEBOOK_CONFIG_ID:}}}
app.oauth.instagram.redirect-uri=${META_REDIRECT_URI:${META_INSTAGRAM_REDIRECT_URI:${META_FACEBOOK_REDIRECT_URI:https://gauntlet-sliver-headfirst.ngrok-free.dev/api/v1/channels/instagram/oauth/callback}}}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=8h
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
