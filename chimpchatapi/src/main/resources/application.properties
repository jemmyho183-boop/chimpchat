spring.application.name=chimpchatapi
spring.config.import=optional:file:../.env[.properties]
spring.profiles.default=local

server.port=${API_PORT:${PORT:8080}}
app.frontend-url=${FRONTEND_URL:${LOCAL_FRONTEND_URL:http://localhost:3000}}
app.auth.email-link.base-url=${app.frontend-url}/auth/verify
app.auth.email-link.ttl=PT15M
app.auth.email-link.from=${MAIL_FROM:ChimpChat <no-reply@chimpchat.local>}
app.auth.email.enabled=${EMAIL_AUTH_ENABLED:false}
app.auth.google.enabled=${GOOGLE_AUTH_ENABLED:true}
app.auth.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.auth.google.redirect-uri=${app.frontend-url}/login/oauth2/code/google
app.auth.google.authorization-uri=${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
app.auth.google.token-uri=${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
app.auth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
app.auth.google.user-info-uri=${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}
app.security.jwt.secret=${JWT_SECRET:local-development-secret-change-me-please-32}
app.security.jwt.access-ttl=PT1H
app.security.jwt.refresh-ttl=P15D
app.security.jwt.cookie-secure=${SESSION_COOKIE_SECURE:true}
app.oauth.instagram.app-id=${META_APP_ID:${META_FACEBOOK_APP_ID:}}
app.oauth.instagram.app-secret=${META_APP_SECRET:${META_FACEBOOK_APP_SECRET:}}
app.oauth.instagram.config-id=${META_CONFIG_ID:${META_INSTAGRAM_CONFIG_ID:${META_FACEBOOK_CONFIG_ID:}}}
app.oauth.instagram.redirect-uri=${META_REDIRECT_URI:${META_INSTAGRAM_REDIRECT_URI:${META_FACEBOOK_REDIRECT_URI:${app.frontend-url}/api/v1/channels/instagram/oauth/callback}}}
app.oauth.instagram.authorization-uri=${META_AUTHORIZATION_URI:https://www.facebook.com/dialog/oauth}
app.oauth.instagram.graph-uri=${META_GRAPH_URI:https://graph.facebook.com/v26.0}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.timeout=8h
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
