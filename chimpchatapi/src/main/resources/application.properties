spring.application.name=chimpchatapi
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.oauth.instagram.client-id=${META_INSTAGRAM_CLIENT_ID:}
app.oauth.instagram.client-secret=${META_INSTAGRAM_CLIENT_SECRET:}
app.oauth.instagram.config-id=${META_INSTAGRAM_CONFIG_ID:${META_FACEBOOK_CONFIG_ID:}}
app.oauth.instagram.redirect-uri=${META_INSTAGRAM_REDIRECT_URI:https://gauntlet-sliver-headfirst.ngrok-free.dev/api/auth/instagram/callback}
app.oauth.facebook.client-id=${META_FACEBOOK_APP_ID:}
app.oauth.facebook.client-secret=${META_FACEBOOK_APP_SECRET:}
app.oauth.facebook.config-id=${META_FACEBOOK_CONFIG_ID:}
app.oauth.facebook.redirect-uri=${META_FACEBOOK_REDIRECT_URI:https://gauntlet-sliver-headfirst.ngrok-free.dev/api/auth/instagram/callback}
