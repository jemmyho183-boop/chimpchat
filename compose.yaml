services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chimpchat}
      POSTGRES_USER: ${POSTGRES_USER:-chimpchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - chimpchat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - chimpchat-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./chimpchatapi
    environment:
      SPRING_PROFILES_ACTIVE: production
      API_PORT: ${API_PORT:-8080}
      FRONTEND_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN in the root .env file}
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://database:5432/${POSTGRES_DB:-chimpchat}}
      DATABASE_USERNAME: ${POSTGRES_USER:-chimpchat}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_AUTHORIZATION_URI: ${GOOGLE_AUTHORIZATION_URI:-https://accounts.google.com/o/oauth2/v2/auth}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_JWK_SET_URI: ${GOOGLE_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      GOOGLE_USER_INFO_URI: ${GOOGLE_USER_INFO_URI:-https://openidconnect.googleapis.com/v1/userinfo}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_CONFIG_ID: ${META_CONFIG_ID:-}
      META_AUTHORIZATION_URI: ${META_AUTHORIZATION_URI:-https://www.facebook.com/dialog/oauth}
      META_GRAPH_URI: ${META_GRAPH_URI:-https://graph.facebook.com/v26.0}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
    expose:
      - "${API_PORT:-8080}"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./chimpchatweb
    environment:
      API_PROXY_TARGET: http://api:${API_PORT:-8080}
      FRONTEND_URL: https://${NGROK_DOMAIN:?Set NGROK_DOMAIN in the root .env file}
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    depends_on:
      - api

  ngrok:
    image: ngrok/ngrok:latest
    command:
      - http
      - --url=${NGROK_DOMAIN:?Set NGROK_DOMAIN in the root .env file}
      - frontend:${FRONTEND_PORT:-3000}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in the root .env file}
    depends_on:
      - frontend

volumes:
  chimpchat-postgres:
  chimpchat-redis:
